name: queuebit-redis-ci

services:
  redis-primary:
    image: redis:7.2-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60 1"
      - --maxmemory-policy
      - noeviction
      - --protected-mode
      - "no"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  redis-replica:
    image: redis:7.2-alpine
    depends_on:
      redis-primary:
        condition: service_healthy
    command:
      - redis-server
      - --replicaof
      - redis-primary
      - "6379"
      - --appendonly
      - "yes"
      - --save
      - "60 1"
      - --maxmemory-policy
      - noeviction
      - --protected-mode
      - "no"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  sentinel-a:
    image: redis:7.2-alpine
    depends_on:
      redis-primary:
        condition: service_healthy
      redis-replica:
        condition: service_healthy
    # Sentinel persists its observed topology, so start from a writable runtime copy.
    command: ["sh", "-lc", "cp /seed/sentinel.conf /tmp/sentinel.conf && exec redis-server /tmp/sentinel.conf --sentinel"]
    volumes:
      - ./sentinel-a.conf:/seed/sentinel.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  sentinel-b:
    image: redis:7.2-alpine
    depends_on:
      redis-primary:
        condition: service_healthy
      redis-replica:
        condition: service_healthy
    # Sentinel persists its observed topology, so start from a writable runtime copy.
    command: ["sh", "-lc", "cp /seed/sentinel.conf /tmp/sentinel.conf && exec redis-server /tmp/sentinel.conf --sentinel"]
    volumes:
      - ./sentinel-b.conf:/seed/sentinel.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  runner:
    image: node:22-bookworm
    working_dir: /workspace
    entrypoint: ["sh", "-lc"]
    command: "npm ci --ignore-scripts && npm run test:redis && npm run test:redis:faults && npm run test:redis:sentinel"
    volumes:
      - ../..:/workspace
      - queuebit-node-modules:/workspace/node_modules
      - queuebit-dist:/workspace/dist

volumes:
  queuebit-node-modules:
  queuebit-dist:
